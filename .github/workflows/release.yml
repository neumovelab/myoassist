name: release

# Tag-driven build. There is no service to deploy, so "delivery" here means producing the
# distribution for a tagged commit and keeping it next to that tag, plus recording which commit
# the artifacts came from. Publishing to an index is deliberately not wired up: it needs a token
# and a decision about who owns the package name, and both belong to a person, not this file.
on:
  push:
    tags: ["v*"]
  # Manual runs let the build be checked before a tag is cut.
  workflow_dispatch:

jobs:
  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - name: Record provenance
        run: |
          {
            echo "commit: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/PROVENANCE.txt
          cat dist/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: myoassist-dist
          path: dist/
