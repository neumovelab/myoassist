name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    # `dev` is where day-to-day work lands, and feature branches reach these checks through
    # their PR into it; gating on main alone let a branch accumulate weeks of unchecked work.
    branches: [main, dev]

jobs:
  # Lint runs standalone (ruff only, no heavy deps) so the style/lint gate is enforced
  # regardless of the RL/CO stack install.
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==0.15.20
      - name: Lint and format check (ruff)
        run: ruff check . && ruff format --check .

  # The suite needs the composed pipeline (myosuite + SB3 + the PyPI sibling packages), so
  # it installs the full deps and runs test_setup.py. The siblings (myo-sim / assist-sim /
  # myoassist-terrains) are on PyPI, so the install resolves without any git clone.
  #
  # Install uses uv, not pip: MyoSuite 2.8.4's metadata pins an older mujoco, and the
  # `[tool.uv] override-dependencies` in pyproject.toml relaxes it so the stack resolves in
  # one command. Plain pip cannot do this and fails with a resolution error.
  #
  # Matrix mirrors setup.py's python_requires (>=3.11); do not add 3.10 back without
  # relaxing that floor.
  test:
    name: test_setup (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - name: Install myoassist + dev deps
        run: uv pip install --system -e . -r requirements-dev.txt
      - name: Run setup checks
        run: python test_setup.py

  # Smoke tests for both the RL and CO paths (tools/tests). RL: every shipped config builds an
  # env with the expected observation and action layout and reaches a PPO update, the activation
  # penalties keep their quadratic form, and training starts on each terrain form. CO: the
  # ParamLayout counts and the bounds generator agree across every control mode and device tail,
  # and the reflex env composes, seats with foot contact, and steps for 22/26/amp/stiffness/ROM.
  # Seconds per case, deterministic, and no assertion depends on how well a policy learns -- PPO
  # carries no seed, so run-to-run variance on any learning-quality metric is as large as the
  # differences between configs and would make a gate flaky. Learning quality stays a measurement,
  # not a check.
  smoke:
    name: smoke (rl + co)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - name: Install myoassist + dev deps
        run: uv pip install --system -e . -r requirements-dev.txt
      - name: Run smoke tests
        env:
          # The runner has 4 cores and the cases are parametrised, so leave torch a small pool
          # rather than letting it fan every op across all of them.
          OMP_NUM_THREADS: "2"
        run: pytest tools/tests -q
